name: Build Windows EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pandas openpyxl pyinstaller plyer

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --collect-all customtkinter --icon=icon.ico --name="Kontroli" Kontroli.py

      - name: Upload compiled EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kontroli-Windows-EXE
          path: dist/*.exe
